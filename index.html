<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SHEP-32 Encryption Protocol</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pako/2.1.0/pako.min.js"></script>
    
    <!-- Polyfill for process.hrtime.bigint() required by SHEP32 in browser environments -->
    <script>
        if (typeof window.process === 'undefined') {
            window.process = {
                env: {},
                versions: {},
                hrtime: {
                    bigint: function() {
                        return BigInt(Date.now()) * 1000000n + BigInt(Math.floor(performance.now() * 1000));
                    }
                }
            };
        } else if (!window.process.hrtime) {
            window.process.hrtime = {
                bigint: function() {
                    return BigInt(Date.now()) * 1000000n + BigInt(Math.floor(performance.now() * 1000));
                }
            };
        }
    </script>

    <!-- Core SHEP32 Module -->
    <script src="./js/shep32.js"></script>

    <style>
        .custom-scrollbar::-webkit-scrollbar { width: 6px; height: 6px; }
        .custom-scrollbar::-webkit-scrollbar-track { background: transparent; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background: #3f3f46; border-radius: 4px; }
        .custom-scrollbar::-webkit-scrollbar-thumb:hover { background: #52525b; }
    </style>
</head>
<body class="bg-zinc-950 text-zinc-300 font-sans selection:bg-cyan-500/30 min-h-screen">
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useRef, useCallback } = React;

        // --- ICONS ---
        const I = {
            shield: '<path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/>',
            copy: '<rect x="9" y="9" width="13" height="13" rx="2" ry="2"></rect><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"></path>',
            check: '<polyline points="20 6 9 17 4 12"></polyline>',
            lock: '<rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect><path d="M7 11V7a5 5 0 0 1 10 0v4"></path>',
            unlock: '<rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect><path d="M7 11V7a5 5 0 0 1 9.9-1"></path>',
            key: '<path d="M21 2l-2 2m-7.61 7.61a5.5 5.5 0 1 1-7.778 7.778 5.5 5.5 0 0 1 7.777-7.777zm0 0L15.5 7.5m0 0l3 3L22 7l-3-3m-3.5 3.5L19 4"></path>',
            dl: '<path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" x2="12" y1="15" y2="3"/>',
            up: '<path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="17 8 12 3 7 8"/><line x1="12" x2="12" y1="3" y2="15"/>',
            info: '<circle cx="12" cy="12" r="10"/><path d="M12 16v-4"/><path d="M12 8h.01"/>',
            eye: '<path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/>',
            eyeoff: '<path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"/><line x1="1" y1="1" x2="23" y2="23"/>',
            x: '<line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line>',

            refresh: '<polyline points="23 4 23 10 17 10"></polyline><polyline points="1 20 1 14 7 14"></polyline><path d="M3.51 9a9 9 0 0 1 14.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0 0 20.49 15"></path>',
            github: '<path d="M9 19c-5 1.5-5-2.5-7-3m14 6v-3.87a3.37 3.37 0 0 0-.94-2.61c3.14-.35 6.44-1.54 6.44-7A5.44 5.44 0 0 0 20 4.77 5.07 5.07 0 0 0 19.91 1S18.73.65 16 2.48a13.38 13.38 0 0 0-7 0C6.27.65 5.09 1 5.09 1A5.07 5.07 0 0 0 5 4.77a5.44 5.44 0 0 0-1.5 3.78c0 5.42 3.3 6.61 6.44 7A3.37 3.37 0 0 0 9 18.13V22"></path>',
            code: '<polyline points="16 18 22 12 16 6"></polyline><polyline points="8 6 2 12 8 18"></polyline>',
            terminal: '<polyline points="4 17 10 11 4 5"></polyline><line x1="12" y1="19" x2="20" y2="19"></line>',
            play: '<polygon points="5 3 19 12 5 21 5 3"></polygon>',
            bar: '<path d="M3 3v18h18"/><rect width="4" height="7" x="7" y="10" rx="1"/><rect width="4" height="12" x="15" y="5" rx="1"/>'
        };
        const Icon = ({n, className, ...p}) => <svg {...p} className={className || "w-4 h-4"} xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" dangerouslySetInnerHTML={{__html: I[n]}}/>;

        // --- UTILS ---
        const DOC_EXTS = ['.txt', '.csv', '.md', '.json', '.xml', '.log', '.html', '.js', '.ts', '.jsx', '.tsx'];

        function downloadBlob(data, filename, type = 'application/octet-stream') {
            const blob = new Blob([data], { type });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = filename;
            a.click();
            URL.revokeObjectURL(url);
        }

        function formatNum(num, digits=2) {
            if(num === undefined || num === null || isNaN(num)) return "—";
            return Number(num).toFixed(digits);
        }

        function downloadTextFile(content, filename) {
            const blob = new Blob([content], { type: 'text/plain' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = filename;
            a.click();
            URL.revokeObjectURL(url);
        }

        // --- BENCHMARK MATH UTILS ---
        const _L1MAX = 1.875;
        function initMatrix() { return { N: 0, pos: Array.from({length: 64}, () => new Array(16).fill(0)), gc: new Array(16).fill(0) }; }
        function pushHex(mx, hx) {
            mx.N++;
            for (let i = 0; i < 64; i++) {
                const v = parseInt(hx[i], 16);
                if(!isNaN(v)) { mx.pos[i][v]++; mx.gc[v]++; }
            }
        }
        function posUniform(mx) {
            if (mx.N <= 0) return 0.0;
            const u = 1.0 / 16.0; let tot = 0.0;
            for (let p = 0; p < 64; p++) {
                let l1 = 0.0;
                for (let c of mx.pos[p]) l1 += Math.abs((c / mx.N) - u);
                tot += (1.0 - (l1 / _L1MAX));
            }
            return Math.max(0.0, Math.min(1.0, tot / 64.0));
        }
        function globalUniform(mx) {
            if (mx.N <= 0) return 0.0;
            const total = 64.0 * mx.N, u = 1.0 / 16.0; let l1 = 0.0;
            for (let c of mx.gc) l1 += Math.abs((c / total) - u);
            return Math.max(0.0, Math.min(1.0, 1.0 - (l1 / _L1MAX)));
        }
        function hexToBits(h) {
            const bits = [];
            for (let ch of (h||"").toLowerCase()) {
                const v = parseInt(ch, 16);
                if (!isNaN(v)) bits.push((v >> 3) & 1, (v >> 2) & 1, (v >> 1) & 1, v & 1);
            }
            return bits;
        }
        function shannonEntropyBit(p1) {
            if (p1 <= 0.0 || p1 >= 1.0) return 0.0;
            const p0 = 1.0 - p1; return -(p0 * Math.log2(p0) + p1 * Math.log2(p1));
        }
        function erfc(x) {
            const t = 1.0 / (1.0 + 0.5 * Math.abs(x));
            const ans = t * Math.exp(-x * x - 1.26551223 + t * (1.00002368 + t * (0.37409196 + t * (0.09678418 + t * (-0.18628806 + t * (0.27886807 + t * (-1.13520398 + t * (1.48851587 + t * (-0.82215223 + t * 0.17087277)))))))));
            return x >= 0 ? ans : 2.0 - ans;
        }
        function runsTestP(bits) {
            const n = bits.length; if (n < 2) return 0.0;
            const ones = bits.reduce((a, b) => a + b, 0), pi = ones / n;
            if (Math.abs(pi - 0.5) >= 2.0 / Math.sqrt(n)) return 0.0;
            let v = 1; for (let i = 1; i < n; i++) if (bits[i] !== bits[i - 1]) v++;
            const num = Math.abs(v - (2.0 * n * pi * (1.0 - pi))), den = 2.0 * Math.sqrt(2.0 * n) * pi * (1.0 - pi);
            return den === 0 ? 0.0 : erfc(num / den);
        }
        function hamming(aBits, bBits) {
            let count = 0, len = Math.min(aBits.length, bBits.length);
            for (let i = 0; i < len; i++) if (aBits[i] !== bBits[i]) count++;
            return count;
        }
        function keyStats(hexList) {
            if (!hexList || !hexList.length) return [0, 0.0, 0.0, 0.0, 0.0];
            const perBits = hexList.map(hexToBits).filter(b => b.length > 0);
            if (!perBits.length) return [0, 0.0, 0.0, 0.0, 0.0];
            const bitLen = perBits[0].length, allBits = [];
            for (const b of perBits) allBits.push(...b);
            const n = allBits.length, ones = allBits.reduce((a, b) => a + b, 0);
            const onesPct = n ? (ones * 100.0 / n) : 0.0, ent = shannonEntropyBit(n ? (ones / n) : 0.0), runsP = runsTestP(allBits);
            let avgHam = 0.0;
            if (perBits.length >= 2) {
                let hs = 0, c = 0;
                for (let i = 1; i < perBits.length; i++) { hs += hamming(perBits[i - 1], perBits[i]); c++; }
                avgHam = c ? (hs / c) : 0.0;
            }
            return [bitLen, onesPct, ent, runsP, avgHam];
        }
        function bitAbsScore(bitLen, onesPct, ent, runsP, avgHam) {
            if (bitLen <= 0) return 0.0;
            const biasN = Math.pow((onesPct - 50.0) / 50.0, 2), entN = Math.pow((1.0 - Math.max(0.0, Math.min(1.0, ent))), 2), hamFrac = (avgHam / bitLen) || 0.0, hamN = Math.pow((hamFrac - 0.5) / 0.5, 2), rp = Math.max(0.0, Math.min(1.0, runsP)), runN = Math.pow((rp - 0.5) / 0.5, 2);
            return 100.0 * Math.max(0.0, Math.min(1.0, 1.0 - ((0.18 * biasN) + (0.18 * entN) + (0.44 * hamN) + (0.20 * runN))));
        }
        function matrixAbsScore(posU, globU) { return 100.0 * (0.85 * posU + 0.15 * globU); }
        function clamp(x, lo, hi) { return x < lo ? lo : (x > hi ? hi : x); }
        function fairPairScores(absA, absB) {
            const base = 0.5 * ((90.0 + 9.0 * (absA / 100.0)) + (90.0 + 9.0 * (absB / 100.0)));
            const delta = 2.25 * Math.tanh((absA - absB) / 10.0);
            return [clamp(base + delta, 90.0, 99.5), clamp(base - delta, 90.0, 99.5)];
        }

        async function sha256Hash(message) {
            const msgUint8 = new TextEncoder().encode(message);
            const hashBuffer = await crypto.subtle.digest('SHA-256', msgUint8);
            const hashArray = Array.from(new Uint8Array(hashBuffer));
            return hashArray.map(b => b.toString(16).padStart(2, '0')).join('');
        }

        // --- API PARSING LOGIC ---
        function getArgs(func) {
            const str = func.toString().replace(/\/\*[\s\S]*?\*\//g, '').replace(/\/\/.*$/gm, '').replace(/\n/g, ' ');
            let match = str.match(/^(?:async\s+)?function(?:\s+\w+)?\s*\(([^)]*)\)/);
            if (match) return parseArgString(match[1]);
            match = str.match(/^(?:async\s+)?(?:\*?\s*)?[a-zA-Z_$][0-9a-zA-Z_$]*\s*\(([^)]*)\)\s*\{/);
            if (match) return parseArgString(match[1]);
            match = str.match(/^(?:async\s+)?\(([^)]*)\)\s*=>/);
            if (match) return parseArgString(match[1]);
            match = str.match(/^(?:async\s+)?([a-zA-Z_$][0-9a-zA-Z_$]*)\s*=>/);
            if (match) return [match[1]];
            return [];
        }

        function parseArgString(str) {
            return str.split(',').map(s => s.trim().split('=')[0].trim()).map(s => s.split(':')[0].trim()).map(s => s.replace(/^[.{3}]+/, '')).filter(s => s && !s.startsWith('//') && !s.startsWith('/*'));
        }

        // --- UI COMPONENTS ---
        const InfoTooltip = ({ text }) => (
            <div className="group relative inline-flex items-center ml-2 align-middle">
                <Icon n="info" className="w-3.5 h-3.5 text-zinc-500 cursor-help hover:text-cyan-400 transition-colors" />
                <div className="absolute bottom-full mb-2 left-1/2 -translate-x-1/2 hidden group-hover:block w-56 p-2 bg-zinc-800 text-zinc-200 text-[10px] rounded-md shadow-xl border border-zinc-700 z-50 text-center pointer-events-none font-mono">
                    {text}
                    <div className="absolute top-full left-1/2 -translate-x-1/2 border-4 border-transparent border-t-zinc-800"></div>
                </div>
            </div>
        );

        const ConfirmModal = ({ isOpen, onClose, onConfirm, title, msg }) => {
            if (!isOpen) return null;
            return (
                <div className="fixed inset-0 bg-black/80 z-50 flex items-center justify-center p-4 backdrop-blur-sm">
                    <div className="bg-zinc-900 border border-zinc-800 rounded-2xl p-6 max-w-sm w-full shadow-2xl">
                        <h3 className="text-lg font-bold text-white mb-2">{title}</h3>
                        <p className="text-sm text-zinc-400 mb-6">{msg}</p>
                        <div className="flex justify-end gap-3">
                            <button onClick={onClose} className="px-4 py-2 text-xs font-bold text-zinc-400 hover:text-white transition-colors">CANCEL</button>
                            <button onClick={() => { onConfirm(); onClose(); }} className="px-4 py-2 bg-red-600 hover:bg-red-500 text-white rounded-lg text-xs font-bold transition-colors">CONFIRM</button>
                        </div>
                    </div>
                </div>
            );
        };

        const FileDropzone = ({ onFile, accept, disabled, label, file }) => {
            const [isDragging, setIsDragging] = useState(false);
            const inputRef = useRef(null);

            const handleDrop = (e) => {
                e.preventDefault(); setIsDragging(false);
                if (disabled) return;
                if (e.dataTransfer.files && e.dataTransfer.files.length > 0) onFile(e.dataTransfer.files[0]);
            };
            
            return (
                <div 
                    onDragOver={(e) => { e.preventDefault(); if(!disabled) setIsDragging(true); }}
                    onDragLeave={() => setIsDragging(false)}
                    onDrop={handleDrop}
                    onClick={() => !disabled && inputRef.current.click()}
                    className={`border-2 border-dashed rounded-xl p-6 text-center transition-all h-full flex flex-col justify-center min-h-[140px] ${disabled ? 'opacity-50 cursor-not-allowed border-zinc-800 bg-zinc-950/50' : isDragging ? 'border-cyan-500 bg-cyan-500/10 cursor-copy' : 'border-zinc-800 hover:border-zinc-600 bg-zinc-900/30 hover:bg-zinc-900/50 cursor-pointer'}`}
                >
                    <input type="file" ref={inputRef} onChange={(e) => e.target.files[0] && onFile(e.target.files[0])} accept={accept} className="hidden" disabled={disabled} />
                    {file ? (
                        <div className="flex flex-col items-center text-cyan-400">
                            <Icon n="file" className="w-8 h-8 mb-2" />
                            <span className="text-xs font-bold break-all px-2">{file.name}</span>
                            <span className="text-[10px] text-zinc-500 mt-1 font-mono">{(file.size / 1024).toFixed(2)} KB</span>
                        </div>
                    ) : (
                        <div className="flex flex-col items-center text-zinc-500">
                            <Icon n="up" className="w-8 h-8 mb-2" />
                            <span className="text-xs font-bold uppercase tracking-widest">{label}</span>
                            <span className="text-[10px] mt-1">Drag & drop or click to browse</span>
                        </div>
                    )}
                </div>
            );
        };

        const ProgressModal = ({ isVisible, isEncrypt, done, total }) => {
            if (!isVisible) return null;
            const pct = total > 0 ? Math.floor((done / total) * 100) : 0;
            
            return (
                <div className="fixed inset-0 bg-black/90 z-50 flex flex-col items-center justify-center p-4 backdrop-blur-sm">
                    <div className="w-full max-w-md bg-zinc-900 border border-zinc-800 rounded-2xl p-8 shadow-2xl">
                        <div className="flex justify-between items-end mb-4">
                            <h3 className="text-xs font-bold text-zinc-400 uppercase tracking-widest flex items-center gap-2">
                                <Icon n="refresh" className="w-4 h-4 text-cyan-500 animate-spin" />
                                {isEncrypt ? 'Encrypting Payload' : 'Decrypting Payload'}
                            </h3>
                            <span className="text-cyan-400 font-mono font-bold">{pct}%</span>
                        </div>
                        <div className="h-2 w-full bg-zinc-950 rounded-full overflow-hidden border border-zinc-800">
                            <div className="h-full bg-cyan-500 transition-all duration-200 shadow-[0_0_10px_rgba(6,182,212,0.5)]" style={{ width: `${pct}%` }} />
                        </div>
                        <div className="flex justify-between mt-4 text-[10px] font-mono text-zinc-500 uppercase">
                            <span>Step {done} of {total}</span>
                            <span>Processing...</span>
                        </div>
                    </div>
                </div>
            );
        };

        const MetricRow = ({ label, shepVal, shaVal, isFinal }) => (
            <div className={`flex justify-between items-center py-3 border-b border-zinc-800/50 last:border-0 ${isFinal ? 'bg-zinc-900/40 rounded-lg px-2 mt-2 border-none' : ''}`}>
                <span className={`w-1/3 text-xs md:text-sm font-mono uppercase tracking-tighter ${isFinal ? 'text-cyan-500 font-bold' : 'text-zinc-400'}`}>{label}</span>
                <span className={`w-1/3 text-center text-sm md:text-base font-bold font-mono ${isFinal ? 'text-white' : 'text-cyan-400'}`}>{shepVal}</span>
                <span className={`w-1/3 text-right text-sm md:text-base font-bold font-mono ${isFinal ? 'text-white' : 'text-zinc-300'}`}>{shaVal}</span>
            </div>
        );

        const CliRunner = ({ shep32Api }) => {
            const [cmd, setCmd] = useState('--text "hello world"');
            const [files, setFiles] = useState({});
            const [result, setResult] = useState(null);
            const [running, setRunning] = useState(false);
            const fileInputRef = useRef(null);

            const handleFileUpload = async (e) => {
                const newFiles = { ...files };
                for (const file of e.target.files) {
                    const buf = await file.arrayBuffer();
                    newFiles[file.name] = new Uint8Array(buf);
                }
                setFiles(newFiles);
                if(fileInputRef.current) fileInputRef.current.value = '';
            };

            const removeFile = (name) => {
                const newFiles = { ...files };
                delete newFiles[name];
                setFiles(newFiles);
            };

            const execute = async () => {
                setRunning(true);
                setResult(null);
                try {
                    const res = await shep32Api.runCli(cmd, { files });
                    setResult(res);
                } catch (err) {
                    setResult({ error: err.toString() });
                }
                setRunning(false);
            };

            return (
                <div className="bg-zinc-900/40 border border-zinc-800 rounded-2xl p-6 shadow-xl w-full">
                    <h3 className="text-xl font-bold text-white mb-4 flex items-center gap-2">
                        <Icon n="terminal" className="text-cyan-500 w-5 h-5"/> CLI Command Runner
                    </h3>
                    <div className="mb-6">
                        <label className="block text-xs font-bold text-zinc-500 uppercase tracking-widest mb-2">Command Arguments</label>
                        <div className="flex flex-col sm:flex-row gap-3">
                            <input 
                                type="text" 
                                className="flex-grow bg-zinc-950 font-mono border border-zinc-800 text-cyan-400 rounded-xl p-3 text-sm focus:ring-1 focus:ring-cyan-500 outline-none"
                                placeholder="e.g. --encrypt-file sample.txt --key secret"
                                value={cmd}
                                onChange={e => setCmd(e.target.value)}
                                onKeyDown={e => e.key === 'Enter' && execute()}
                            />
                            <button 
                                onClick={execute}
                                disabled={running}
                                className="bg-cyan-600 hover:bg-cyan-500 disabled:bg-cyan-900/50 text-white px-8 py-3 rounded-xl font-bold transition-colors whitespace-nowrap text-sm uppercase tracking-widest"
                            >
                                {running ? 'Running...' : 'Execute'}
                            </button>
                        </div>
                        <p className="text-[10px] text-zinc-500 mt-2 font-mono">Try: <code className="bg-zinc-800 text-zinc-300 px-1 rounded">--text "abc"</code> or <code className="bg-zinc-800 text-zinc-300 px-1 rounded">--help</code></p>
                    </div>
                    
                    <div className="mb-6 bg-zinc-950/50 p-4 rounded-xl border border-dashed border-zinc-800">
                        <label className="block text-xs font-bold text-zinc-400 uppercase tracking-widest mb-1.5">Virtual File System (ctx.files)</label>
                        <p className="text-[10px] text-zinc-500 mb-3">Upload files here to use them in commands like <code className="bg-zinc-800 px-1 rounded text-zinc-300">--encrypt-file filename.txt</code></p>
                        <div className="flex items-center gap-4 mb-3">
                            <input 
                                type="file" 
                                multiple 
                                onChange={handleFileUpload} 
                                ref={fileInputRef}
                                className="block w-full text-xs text-zinc-500 file:mr-4 file:py-2 file:px-4 file:rounded-lg file:border-0 file:text-xs file:font-bold file:bg-cyan-900/30 file:text-cyan-400 hover:file:bg-cyan-900/50 cursor-pointer"
                            />
                        </div>
                        {Object.keys(files).length > 0 && (
                            <div className="flex flex-wrap gap-2 mt-4">
                                {Object.entries(files).map(([name, data]) => (
                                    <div key={name} className="flex items-center gap-2 bg-zinc-900 px-3 py-1.5 rounded-lg border border-zinc-700 text-xs shadow-sm">
                                        <span className="font-mono text-zinc-300">{name} <span className="text-[10px] text-zinc-500">({data.length} bytes)</span></span>
                                        <button onClick={() => removeFile(name)} className="text-red-400 hover:text-red-300 font-bold ml-2 text-lg leading-none">&times;</button>
                                    </div>
                                ))}
                            </div>
                        )}
                    </div>

                    {result && (
                        <div className="mt-6 border-t border-zinc-800 pt-6">
                            <h4 className="text-xs font-bold uppercase tracking-widest text-zinc-500 mb-3">Execution Output</h4>
                            {result.error ? (
                                <div className="bg-red-950/30 text-red-400 p-4 rounded-xl font-mono text-xs overflow-auto max-h-64 whitespace-pre-wrap border border-red-900/50">
                                    {result.error}
                                </div>
                            ) : (
                                <div className="space-y-4">
                                    {(result.stdout || result.stderr) ? (
                                        <div className="bg-zinc-950 text-zinc-300 p-4 rounded-xl font-mono text-xs overflow-auto max-h-96 whitespace-pre-wrap shadow-inner border border-zinc-800 relative custom-scrollbar">
                                            {result.stdout && <div>{result.stdout}</div>}
                                            {result.stderr && <div className="text-red-400">{result.stderr}</div>}
                                            <div className="absolute top-2 right-2 text-zinc-500 text-[10px] font-sans bg-zinc-900 px-2 py-1 rounded border border-zinc-800">Exit: {result.exitCode}</div>
                                        </div>
                                    ) : (
                                        <div className="bg-zinc-950 text-zinc-500 p-4 rounded-xl text-xs font-mono border border-zinc-800">Command executed successfully with no console output.</div>
                                    )}
                                    {result.files && Object.keys(result.files).length > 0 && (
                                        <div className="bg-cyan-950/20 border border-cyan-900/50 p-4 rounded-xl">
                                            <h5 className="text-xs font-bold text-cyan-500 mb-3 uppercase tracking-widest">Generated / Modified Files</h5>
                                            <div className="flex flex-col gap-2">
                                                {Object.entries(result.files).map(([name, data]) => (
                                                    <div key={name} className="flex items-center justify-between bg-zinc-950 border border-zinc-800 p-3 rounded-lg shadow-sm">
                                                        <span className="font-mono text-zinc-300 text-xs">{name} <span className="text-[10px] text-zinc-500 ml-1">({data.length} bytes)</span></span>
                                                        <button 
                                                            onClick={() => downloadBlob(data, name)}
                                                            className="bg-cyan-600 hover:bg-cyan-500 text-white px-4 py-1.5 rounded-md text-[10px] font-bold transition-colors uppercase tracking-widest"
                                                        >
                                                            Download
                                                        </button>
                                                    </div>
                                                ))}
                                            </div>
                                        </div>
                                    )}
                                </div>
                            )}
                        </div>
                    )}
                </div>
            );
        };

        const FunctionCard = ({ funcDef }) => {
            const [args, setArgs] = useState(funcDef.params.reduce((acc, param) => ({ ...acc, [param]: '' }), {}));
            const [result, setResult] = useState(null);
            const [error, setError] = useState(null);
            const [status, setStatus] = useState('idle');

            const execute = async () => {
                setResult(null);
                setError(null);
                setStatus('idle');
                try {
                    const parsedArgs = funcDef.params.map(param => {
                        const val = args[param];
                        if (val === '') return undefined;
                        try { return JSON.parse(val); } catch (e) { return val; }
                    });

                    let res = funcDef.func.apply(funcDef.context, parsedArgs);
                    if (res instanceof Promise) res = await res;
                    
                    if (typeof res === 'object') {
                        if (res instanceof Uint8Array) {
                            setResult(`Uint8Array(${res.length}) [${res.slice(0, 20).join(', ')}${res.length > 20 ? '...' : ''}]`);
                        } else {
                            setResult(JSON.stringify(res, null, 2));
                        }
                    } else if (res === undefined) {
                        setResult('undefined');
                    } else {
                        setResult(String(res));
                    }
                    setStatus('success');
                } catch (e) {
                    setError(e.toString());
                    setStatus('error');
                }
            };

            return (
                <div className="bg-zinc-900/40 p-6 rounded-2xl shadow-sm border border-zinc-800 flex flex-col w-full">
                    <div className="flex justify-between items-start mb-4">
                        <h3 className="text-sm font-bold text-white font-mono break-all pr-4">
                            <span className="text-cyan-400">{funcDef.name}</span>()
                        </h3>
                        {status === 'success' && <Icon n="check" className="w-5 h-5 text-green-400 shrink-0" />}
                        {status === 'error' && <Icon n="x" className="w-5 h-5 text-red-500 shrink-0" />}
                    </div>

                    <div className="space-y-4 mb-6 flex-grow">
                        {funcDef.params.map(param => (
                            <div key={param}>
                                <label className="block text-[10px] font-bold text-zinc-500 uppercase tracking-widest mb-1.5">{param}</label>
                                <input 
                                    type="text" 
                                    className="w-full bg-zinc-950 border border-zinc-800 rounded-lg focus:ring-1 focus:ring-cyan-500 p-2.5 text-xs text-zinc-300 transition-colors outline-none font-mono"
                                    placeholder={`Enter ${param}...`}
                                    value={args[param]}
                                    onChange={e => setArgs({...args, [param]: e.target.value})}
                                />
                            </div>
                        ))}
                        {funcDef.params.length === 0 && (
                            <div className="h-full flex items-center justify-center p-4 bg-zinc-950/50 border border-dashed border-zinc-800 rounded-lg">
                                <p className="text-xs text-zinc-600 font-mono italic">No arguments required.</p>
                            </div>
                        )}
                    </div>

                    <button 
                        onClick={execute}
                        className="flex items-center justify-center w-full bg-zinc-800 hover:bg-zinc-700 text-white px-4 py-2.5 rounded-xl font-bold uppercase tracking-widest text-[10px] transition-colors"
                    >
                        <Icon n="play" className="w-3.5 h-3.5 mr-2" /> Execute
                    </button>
                    
                    {(result !== null || error !== null) && (
                        <div className={`mt-4 p-4 rounded-xl border custom-scrollbar overflow-auto max-h-48 ${error ? 'bg-red-950/20 border-red-900/50' : 'bg-zinc-950 border-zinc-800'}`}>
                            <span className={`text-[10px] font-bold uppercase tracking-widest ${error ? 'text-red-500' : 'text-zinc-500'}`}>
                                {error ? 'Error Output' : 'Return Value'}
                            </span>
                            {error ? (
                                <pre className="text-red-400 whitespace-pre-wrap text-xs mt-1.5 font-mono">{error}</pre>
                            ) : (
                                <pre className="text-zinc-300 whitespace-pre-wrap text-xs mt-1.5 font-mono">{result}</pre>
                            )}
                        </div>
                    )}
                </div>
            );
        }

        /**
         * MAIN APPLICATION
         */
        const App = () => {
            const defaultScriptUrl = './js/shep32.js';
            const [coreLoaded, setCoreLoaded] = useState(false);
            const [coreError, setCoreError] = useState('');
            const [activeTab, setActiveTab] = useState('about'); 
            const [resetModal, setResetModal] = useState({ open: false, onConfirm: null });
            
            // Progress State
            const [isProcessing, setIsProcessing] = useState(false);
            const [progressDone, setProgressDone] = useState(0);
            const [progressTotal, setProgressTotal] = useState(1);
            const [processingType, setProcessingType] = useState('encrypt');

            // Global API state
            const [apiFuncs, setApiFuncs] = useState([]);
            const [cliViewMode, setCliViewMode] = useState('cli'); 

            // Handle dynamic loader bypass to load SHEP32 from GitHub directly
            const loadCoreScript = async (url) => {
                setCoreLoaded(false);
                setCoreError('');
                try {
                    let fetchUrl = url;
                    if (fetchUrl.includes('github.com') && !fetchUrl.includes('raw.githubusercontent.com')) {
                        fetchUrl = fetchUrl.replace('github.com', 'raw.githubusercontent.com').replace('/blob/', '/');
                    }
                    const res = await fetch(fetchUrl);
                    if (!res.ok) throw new Error(`Failed to fetch script: ${res.statusText}`);
                    const text = await res.text();
                    
                    await new Promise((resolve, reject) => {
                        try {
                            const scriptEl = document.createElement('script');
                            scriptEl.text = text;
                            document.body.appendChild(scriptEl);
                            resolve();
                        } catch(e) {
                            reject(e);
                        }
                    });
                    
                    if (!window.SHEP32) throw new Error("SHEP32 object not found.");
                    
                    const funcs = [];
                    for (const [key, value] of Object.entries(window.SHEP32)) {
                        if (typeof value === 'function') {
                            funcs.push({ name: key, func: value, params: getArgs(value), context: window.SHEP32 });
                        }
                    }
                    setApiFuncs(funcs);
                    setCoreLoaded(true);
                } catch (e) {
                    setCoreError(e.toString());
                }
            };

            useEffect(() => {
                if (window.SHEP32) {
                    const funcs = [];
                    for (const [key, value] of Object.entries(window.SHEP32)) {
                        if (typeof value === 'function') {
                            funcs.push({ name: key, func: value, params: getArgs(value), context: window.SHEP32 });
                        }
                    }
                    setApiFuncs(funcs);
                    setCoreLoaded(true);
                } else {
                    loadCoreScript(defaultScriptUrl);
                }
            }, []);

            // --- TAB: GENERATE KEY ---
            const [genUsePhrase, setGenUsePhrase] = useState(false);
            const [genPhrase, setGenPhrase] = useState('');
            const [genResult, setGenResult] = useState('');
            const [genCopied, setGenCopied] = useState(false);
            const [genIsExtended, setGenIsExtended] = useState(false);

            const handleGenerateKey = () => {
                const mode = genIsExtended ? 1 : 0;
                if (genUsePhrase) {
                    if (!genPhrase.trim()) return;
                    setGenResult(window.SHEP32.generateKey(genPhrase, mode, 8));
                } else {
                    setGenResult(window.SHEP32.generateKey(undefined, mode, 8));
                }
            };

            // --- TAB: ENCRYPT ---
            const [encInputType, setEncInputType] = useState(null); 
            const [encText, setEncText] = useState('');
            const [encFile, setEncFile] = useState(null);
            const [encOutputName, setEncOutputName] = useState('');
            
            const [encKeyMode, setEncKeyMode] = useState('manual'); 
            const [encManualKey, setEncManualKey] = useState('');
            const [encPhrase, setEncPhrase] = useState('');
            const [encKeyFile, setEncKeyFile] = useState(null);
            const [encKeyFileHex, setEncKeyFileHex] = useState('');
            const [encIsExtended, setEncIsExtended] = useState(false);
            
            const [encError, setEncError] = useState('');
            const [encResult, setEncResult] = useState(null); 
            const [encShowPreview, setEncShowPreview] = useState(false);

            const encDerivedKey = encKeyMode === 'phrase' && encPhrase ? window.SHEP32.generateKey(encPhrase, encIsExtended ? 1 : 0, 8) : '';
            const encActiveKey = encKeyMode === 'file' ? encKeyFileHex : (encKeyMode === 'phrase' ? encDerivedKey : encManualKey);

            const handleEncryptKeyFile = async (file) => {
                try {
                    const text = await file.text();
                    const keyStr = window.SHEP32.parseKeyFileText(text).trim();
                    setEncKeyFile(file);
                    setEncKeyFileHex(keyStr);
                    setEncKeyMode('file');
                    setEncError('');
                    if (keyStr.length === 72) setEncIsExtended(true);
                    else if (keyStr.length === 64) setEncIsExtended(false);
                } catch(e) {
                    setEncError('Invalid key file format.');
                }
            };

            // --- TAB: DECRYPT ---
            const [decInputType, setDecInputType] = useState(null); 
            const [decText, setDecText] = useState('');
            const [decFile, setDecFile] = useState(null);
            const [decFileData, setDecFileData] = useState(''); 
            
            const [decKeyMode, setDecKeyMode] = useState('manual'); 
            const [decManualKey, setDecManualKey] = useState('');
            const [decPhrase, setDecPhrase] = useState('');
            const [decKeyFile, setDecKeyFile] = useState(null);
            const [decKeyFileHex, setDecKeyFileHex] = useState('');
            const [decIsExtended, setDecIsExtended] = useState(false);

            const [decError, setDecError] = useState('');
            const [decResult, setDecResult] = useState(null); 
            const [decOutputChoice, setDecOutputChoice] = useState('browser'); 

            const decDerivedKey = decKeyMode === 'phrase' && decPhrase ? window.SHEP32.generateKey(decPhrase, decIsExtended ? 1 : 0, 8) : '';
            const decActiveKey = decKeyMode === 'file' ? decKeyFileHex : (decKeyMode === 'phrase' ? decDerivedKey : decManualKey);

            const handleDecryptKeyFile = async (file) => {
                try {
                    const text = await file.text();
                    const keyStr = window.SHEP32.parseKeyFileText(text).trim();
                    setDecKeyFile(file);
                    setDecKeyFileHex(keyStr);
                    setDecKeyMode('file');
                    setDecError('');
                    if (keyStr.length === 72) setDecIsExtended(true);
                    else if (keyStr.length === 64) setDecIsExtended(false);
                } catch(e) {
                    setDecError('Invalid key file format.');
                }
            };

            const handleDecryptFileUpload = async (file) => {
                const text = await file.text();
                setDecFileData(text.trim());
                setDecFile(file);
                setDecInputType('file');
                setDecOutputChoice('file');
                setDecText('');
                setDecError('');
            };

            // --- ENCRYPTION EXECUTION ---
            const executeEncrypt = () => {
                setEncError('');
                
                let targetKey = encActiveKey;
                let isAutoKey = false;
                const modeValue = encIsExtended ? 1 : 0;
                
                if (!targetKey) {
                    let rawData = encInputType === 'file' ? encFile.name + encFile.size : encText;
                    targetKey = window.SHEP32.generateKey(rawData || 'auto', modeValue, 8);
                    isAutoKey = true;
                } else {
                    if (encIsExtended && !window.SHEP32.isExtendedKey(targetKey, 8)) {
                        setEncError('Active key must be a valid SHEP333 extended key.'); return;
                    } else if (!encIsExtended && !/^[0-9a-f]{64}$/i.test(targetKey)) {
                        setEncError('Active key must be exactly 64 hex characters.'); return;
                    }
                }

                setProcessingType('encrypt');
                setProgressDone(0);
                setProgressTotal(1);
                setIsProcessing(true);

                setTimeout(async () => {
                    try {
                        let payloadStr = '';
                        let origName = 'data';
                        
                        if (encInputType === 'file') {
                            origName = encFile.name;
                            const fileBytes = new Uint8Array(await encFile.arrayBuffer());
                            payloadStr = window.SHEP32.packFilePayload(origName, fileBytes);
                        } else {
                            payloadStr = encText; 
                        }

                        const isCompressibleFile = (encInputType === 'file' && encFile.size > 5120);
                        const outResult = await window.SHEP32.encryptDataAsync(payloadStr, targetKey, modeValue, 8, false, isCompressibleFile, 2048, 0, '0', '', '', '', ({ done, total }) => { setProgressDone(done); setProgressTotal(total); });
                        
                        setProgressDone(1);
                        setProgressTotal(1);
                        setIsProcessing(false);
                        setEncResult({ 
                            c: outResult.cipher, 
                            keyUsed: outResult.key, 
                            origName, 
                            isFile: encInputType === 'file', 
                            isAutoKey,
                            customName: encOutputName.trim()
                        });

                    } catch (e) {
                        setIsProcessing(false);
                        setEncError("Encryption failed: " + e.message);
                    }
                }, 100);
            };

            // --- DECRYPTION EXECUTION ---
            const executeDecrypt = () => {
                setDecError('');
                
                if (decIsExtended && !window.SHEP32.isExtendedKey(decActiveKey, 8)) {
                    setDecError('Active key must be a valid SHEP333 extended key.'); return;
                } else if (!decIsExtended && !/^[0-9a-f]{64}$/i.test(decActiveKey)) {
                    setDecError('Active key must be exactly 64 hex characters.'); return;
                }

                let payloadStr = decInputType === 'file' ? decFileData : decText.trim();
                if (!payloadStr) {
                    setDecError('No valid payload detected.'); return;
                }

                setProcessingType('decrypt');
                setProgressDone(0);
                setProgressTotal(1);
                setIsProcessing(true);

                setTimeout(async () => {
                    try {
                        const modeValue = decIsExtended ? 333 : 0;
                        const outText = await window.SHEP32.decryptDataExAsync(payloadStr, decActiveKey, modeValue, 8, null, ({ done, total }) => { setProgressDone(done); setProgressTotal(total); });
                        
                        let isFileRestored = false;
                        let restoredName = 'restored_data.bin';
                        let pureData = new Uint8Array(0);
                        let textResult = '';

                        const unpackedFile = window.SHEP32.unpackFilePayload(outText);

                        if (unpackedFile) {
                            isFileRestored = true;
                            restoredName = unpackedFile.name;
                            pureData = unpackedFile.data;
                        } else {
                            textResult = outText;
                            if (decOutputChoice === 'file') {
                                pureData = new TextEncoder().encode(textResult);
                            }
                        }

                        setProgressDone(1);
                        setProgressTotal(1);
                        setIsProcessing(false);
                        setDecResult({ isFile: isFileRestored || decOutputChoice === 'file', name: restoredName, dataBytes: pureData, text: textResult });

                    } catch (e) {
                        setIsProcessing(false);
                        setDecError("Decryption failed: Invalid key or corrupted data structure.");
                    }
                }, 100);
            };

            // --- BENCHMARK ---
            const [benchConfig, setBenchConfig] = useState({ iters: 5000, mode: 1, startCp: 0, extended: false });
            // FIXED: Initialized shepAllHashes and shaAllHashes in the initial benchmark status
            const [benchStatus, setBenchStatus] = useState({ 
                running: false, current: 0, betterTally: { shep: 0, sha: 0 }, history: [], shepAllHashes: [], shaAllHashes: [] 
            });
            const abortRef = useRef(false);

            const runBenchmark = async () => {
                setBenchStatus(prev => ({ 
                    ...prev, running: true, current: 0, history: [], betterTally: { shep: 0, sha: 0 }, shepAllHashes: [], shaAllHashes: [] 
                }));
                abortRef.current = false;
                
                let shepMxAll = initMatrix();
                let shaMxAll = initMatrix();
                let currentCp = benchConfig.startCp;
                const endCp = 0x10FFFF;
                const chunkLen = 32;
                const CHUNK_SIZE = 100;
                const total = Math.min(benchConfig.iters, 250000);
                
                let shepHList = [];
                let shaHList = [];
                let newBetterTally = { shep: 0, sha: 0 };

                for (let i = 0; i < total; i += CHUNK_SIZE) {
                    if (abortRef.current) break;
                    const end = Math.min(i + CHUNK_SIZE, total);
                    let catName = "";
                    let lastLen = 0;
                    let shepOk = 0;
                    let shaOk = 0;

                    for (let j = i; j < end; j++) {
                        let s = "";
                        if (benchConfig.mode === 0) {
                            const n = Math.floor(Math.random() * (100 - 5 + 1)) + 5;
                            s = window.SHEP32.encodeHex ? window.SHEP32.encodeHex(Math.floor(Math.random() * 1e15)) : Math.random().toString(36).substring(2);
                            catName = "Random String";
                        } else if (benchConfig.mode === 1) {
                            if (currentCp > endCp) break;
                            let a = currentCp;
                            let b = Math.min(endCp, currentCp + chunkLen - 1);
                            for (let x = a; x <= b; x++) if (!(x >= 0xD800 && x <= 0xDFFF)) s += String.fromCodePoint(x);
                            catName = `uSeq=${a}-${b},len=${chunkLen}`;
                            currentCp = b + 1;
                        } else if (benchConfig.mode === 2) {
                            if (currentCp > endCp) break;
                            while (currentCp >= 0xD800 && currentCp <= 0xDFFF && currentCp <= endCp) currentCp++;
                            if (currentCp > endCp) break;
                            s = String.fromCodePoint(currentCp);
                            catName = `progress=${currentCp}`;
                            currentCp++;
                        }
                        
                        lastLen = s.length;
                        if (!s) continue;

                        const rawKey = window.SHEP32.generateKey(s, benchConfig.extended ? 1 : 0, 8);
                        // FIXED: Added fallback for bodyHex extraction if unpackExtendedKey is missing
                        let shepH = rawKey;
                        if (benchConfig.extended) {
                            shepH = (window.SHEP32.unpackExtendedKey) ? window.SHEP32.unpackExtendedKey(rawKey, 8).bodyHex : rawKey.substring(4, 68);
                        }
                        const shaH = await sha256Hash(s);

                        shepHList.push(shepH);
                        shaHList.push(shaH);
                        
                        pushHex(shepMxAll, shepH); shepOk++;
                        pushHex(shaMxAll, shaH); shaOk++;
                    }

                    let [shepBitLen, shepOnesPct, shepEnt, shepRunsP, shepAvgHam] = keyStats(shepHList);
                    let [shaBitLen, shaOnesPct, shaEnt, shaRunsP, shaAvgHam] = keyStats(shaHList);
                    
                    let shepPosU = posUniform(shepMxAll);
                    let shepGlobU = globalUniform(shepMxAll);
                    let shaPosU = posUniform(shaMxAll);
                    let shaGlobU = globalUniform(shaMxAll);

                    let shepBitAbs = bitAbsScore(shepBitLen, shepOnesPct, shepEnt, shepRunsP, shepAvgHam);
                    let shepMatAbs = matrixAbsScore(shepPosU, shepGlobU);

                    let shaBitAbs = bitAbsScore(shaBitLen, shaOnesPct, shaEnt, shaRunsP, shaAvgHam);
                    let shaMatAbs = matrixAbsScore(shaPosU, shaGlobU);

                    let shepAbs = (0.55 * shepBitAbs) + (0.45 * shepMatAbs);
                    let shaAbs = (0.55 * shaBitAbs) + (0.45 * shaMatAbs);

                    let [shepFinal, shaFinal] = fairPairScores(shepAbs, shaAbs);
                    
                    let betterName = shepFinal > shaFinal ? "SHEP32" : (shaFinal > shepFinal ? "SHA256" : "TIE");
                    if(betterName === "SHEP32") newBetterTally.shep++;
                    else if(betterName === "SHA256") newBetterTally.sha++;

                    // FIXED: Now accurately tracks shepAllHashes and shaAllHashes 
                    setBenchStatus(prev => ({
                        ...prev,
                        current: end,
                        betterTally: { ...newBetterTally },
                        history: [...prev.history, {
                            iter: end, cat: catName, len: lastLen,
                            shepOk, shaOk,
                            shepOnes: shepOnesPct, shaOnes: shaOnesPct,
                            shepEnt: shepEnt, shaEnt: shaEnt,
                            shepRuns: shepRunsP, shaRuns: shaRunsP,
                            shepHam: shepAvgHam, shaHam: shaAvgHam,
                            shepPosU: shepPosU * 100, shaPosU: shaPosU * 100,
                            shepGlobU: shepGlobU * 100, shaGlobU: shaGlobU * 100,
                            shepAbs, shaAbs, 
                            shepFinal, shaFinal, better: betterName
                        }],
                        shepAllHashes: shepHList,
                        shaAllHashes: shaHList
                    }));

                    await new Promise(r => setTimeout(r, 10)); // Yield to UI
                }

                setBenchStatus(prev => ({ ...prev, running: false }));
            };

            // FIXED: Added missing downloadCSV function to App component
            const downloadCSV = () => {
                if(!benchStatus.history.length) return;
                const headers = "iter,category,len,shepOk,shaOk,shepOnes,shaOnes,shepEnt,shaEnt,shepRuns,shaRuns,shepHam,shaHam,shepPosU,shaPosU,shepGlobU,shaGlobU,shepAbs,shaAbs,shepFinal,shaFinal,better\n";
                const rows = benchStatus.history.map(r => 
                    `${r.iter},${r.cat},${r.len},${r.shepOk},${r.shaOk},${formatNum(r.shepOnes)},${formatNum(r.shaOnes)},${formatNum(r.shepEnt,3)},${formatNum(r.shaEnt,3)},${formatNum(r.shepRuns,4)},${formatNum(r.shaRuns,4)},${formatNum(r.shepHam)},${formatNum(r.shaHam)},${formatNum(r.shepPosU)},${formatNum(r.shaPosU)},${formatNum(r.shepGlobU)},${formatNum(r.shaGlobU)},${formatNum(r.shepAbs)},${formatNum(r.shaAbs)},${formatNum(r.shepFinal)},${formatNum(r.shaFinal)},${r.better}`
                ).join("\n");
                
                downloadTextFile(headers + rows, "SHEP32_Benchmark_Stats.csv");
            };

            const copyToClipboard = (text) => {
                const el = document.createElement('textarea');
                el.value = text;
                document.body.appendChild(el);
                el.select();
                document.execCommand('copy');
                document.body.removeChild(el);
            };

            const resetAll = () => {
                setEncInputType(null); setEncText(''); setEncFile(null); setEncOutputName(''); setEncKeyMode('manual'); setEncManualKey(''); setEncPhrase(''); setEncKeyFile(null); setEncKeyFileHex(''); setEncError(''); setEncResult(null);
                setDecInputType(null); setDecText(''); setDecFile(null); setDecFileData(''); setDecKeyMode('manual'); setDecManualKey(''); setDecPhrase(''); setDecKeyFile(null); setDecKeyFileHex(''); setDecError(''); setDecResult(null);
                setGenPhrase(''); setGenResult(''); setGenUsePhrase(false);
            };

                                                        <th className="py-2 px-3 text-cyan-500">shepHam</th>
                                                        <th className="py-2 px-3">shaHam</th>
                                                        <th className="py-2 px-3 text-cyan-500">shepPosU</th>
                                                        <th className="py-2 px-3">shaPosU</th>
                                                        <th className="py-2 px-3 text-cyan-500">shepGlobU</th>
                                                        <th className="py-2 px-3">shaGlobU</th>
                                                        <th className="py-2 px-3 text-cyan-500">shepAbs</th>
                                                        <th className="py-2 px-3">shaAbs</th>
                                                        <th className="py-2 px-3 text-cyan-400 font-bold">shepFinal</th>
                                                        <th className="py-2 px-3 font-bold">shaFinal</th>
                                                        <th className="py-2 px-3 text-yellow-500 text-center">better</th>
                                                    </tr>

                                                <tbody>
                                                    {visibleHistory.map((r, i) => (
                                                        <tr key={`row-${i}`} className="hover:bg-zinc-800/30 border-b border-zinc-900/50 h-[30px]">
                                                            <td className="py-1 px-3 text-left">{r.iter}</td>
                                                            <td className="py-1 px-3 text-left">{r.cat}</td>
                                                            <td className="py-1 px-3">{r.len}</td>
                                                            <td className="py-1 px-3 text-cyan-400">{r.shepOk}</td>
                                                            <td className="py-1 px-3 text-zinc-400">{r.shaOk}</td>
                                                            <td className="py-1 px-3 text-cyan-400">{formatNum(r.shepOnes)}</td>
                                                            <td className="py-1 px-3 text-zinc-400">{formatNum(r.shaOnes)}</td>
                                                            <td className="py-1 px-3 text-cyan-400">{formatNum(r.shepEnt, 3)}</td>
                                                            <td className="py-1 px-3 text-zinc-400">{formatNum(r.shaEnt, 3)}</td>
                                                            <td className="py-1 px-3 text-cyan-400">{formatNum(r.shepRuns, 4)}</td>
                                                            <td className="py-1 px-3 text-zinc-400">{formatNum(r.shaRuns, 4)}</td>
                                                            <td className="py-1 px-3 text-cyan-400">{formatNum(r.shepHam)}</td>
                                                            <td className="py-1 px-3 text-zinc-400">{formatNum(r.shaHam)}</td>
                                                            <td className="py-1 px-3 text-cyan-400">{formatNum(r.shepPosU)}</td>
                                                            <td className="py-1 px-3 text-zinc-400">{formatNum(r.shaPosU)}</td>
                                                            <td className="py-1 px-3 text-cyan-400">{formatNum(r.shepGlobU)}</td>
                                                            <td className="py-1 px-3 text-zinc-400">{formatNum(r.shaGlobU)}</td>
                                                            <td className="py-1 px-3 text-cyan-400">{formatNum(r.shepAbs, 4)}</td>
                                                            <td className="py-1 px-3 text-zinc-400">{formatNum(r.shaAbs, 4)}</td>
                                                            <td className="py-1 px-3 text-cyan-300 font-bold">{formatNum(r.shepFinal)}</td>
                                                            <td className="py-1 px-3 text-white font-bold">{formatNum(r.shaFinal)}</td>
                                                            <td className={`py-1 px-3 text-center font-bold ${r.better === 'SHEP32' ? 'text-cyan-400' : 'text-zinc-300'}`}>
                                                                {r.better}
                                                            </td>
                                                        </tr>
                                                    ))}
                                                    {[...Array(paddingRows)].map((_, i) => (
                                                        <tr key={`pad-${i}`} className="border-b border-zinc-900/50 h-[30px]"><td colSpan="22"></td></tr>
                                                    ))}
                                                </tbody>
                                            </table>
                                        </div>
                                    </div>

                                    <div className="bg-zinc-900/30 border border-zinc-800/50 rounded-2xl p-6 flex flex-col md:flex-row gap-4 items-center justify-between">
                                        <div className="flex flex-col sm:flex-row gap-4 w-full md:w-auto">
                                            <button 
                                                onClick={() => downloadTextFile(benchStatus.shepAllHashes.join('\n'), 'SHEP32_Hash_Audit.txt')}
                                                disabled={!benchStatus.shepAllHashes.length}
                                                className="px-4 py-2 bg-zinc-900 hover:bg-zinc-800 text-cyan-400 border border-zinc-800 rounded-lg text-xs font-bold flex items-center justify-center gap-2 disabled:opacity-50 w-full sm:w-auto"
                                            >
                                                <Icon n="dl" className="w-3.5 h-3.5" /> DL: SHEP32 HASH AUDIT
                                            </button>
                                            <button 
                                                onClick={() => downloadTextFile(benchStatus.shaAllHashes.join('\n'), 'SHA256_Hash_Audit.txt')}
                                                disabled={!benchStatus.shaAllHashes.length}
                                                className="px-4 py-2 bg-zinc-900 hover:bg-zinc-800 text-zinc-400 border border-zinc-800 rounded-lg text-xs font-bold flex items-center justify-center gap-2 disabled:opacity-50 w-full sm:w-auto"
                                            >
                                                <Icon n="dl" className="w-3.5 h-3.5" /> DL: SHA256 HASH AUDIT
                                            </button>
                                        </div>
                                        <button 
                                            onClick={downloadCSV}
                                            disabled={!benchStatus.history.length}
                                            className="px-6 py-2 bg-cyan-600 hover:bg-cyan-500 text-white rounded-lg text-xs font-bold flex items-center justify-center gap-2 disabled:opacity-50 shadow-lg w-full md:w-auto"
                                        >
                                            <Icon n="dl" className="w-3.5 h-3.5" /> DL: STATS PER ROUND (CSV)
                                        </button>
                                    </div>
                                </div>
                            )}
                        </main>
                    </div>

                    <footer className="w-full max-w-6xl mt-16 border-t border-zinc-900 pt-8 flex flex-col items-center justify-center gap-6 text-zinc-600 pb-4">
                        <div className="text-center">
                            <p className="text-[10px] font-mono">
                                <span className="text-zinc-500 font-bold uppercase tracking-widest">andrew lehti</span> &copy; 2024-{new Date().getFullYear()}
                            </p>
                            <a href="http://metopedia.com" target="_blank" rel="noopener noreferrer" className="text-[9px] font-mono text-cyan-900 hover:text-cyan-700 uppercase tracking-tighter">
                                metopedia.com
                            </a>
                        </div>
                        
                        <div className="flex flex-wrap justify-center items-center gap-3 md:gap-4 text-[9px] font-mono tracking-tighter uppercase px-4">
                            <a href="https://figshare.com/authors/Andrew_Lehti/19424050" target="_blank" rel="noopener noreferrer" className="hover:text-cyan-500 transition-colors">Figshare</a>
                            <span className="text-zinc-800">|</span>
                            <a href="https://cmu.academia.edu/AndrewLehti" target="_blank" rel="noopener noreferrer" className="hover:text-cyan-500 transition-colors">Academia</a>
                            <span className="text-zinc-800">|</span>
                            <a href="https://orcid.org/0000-0002-0051-5851" target="_blank" rel="noopener noreferrer" className="hover:text-cyan-500 transition-colors">ORCID</a>
                            <span className="text-zinc-800">|</span>
                            <a href="https://github.com/andylehti/" target="_blank" rel="noopener noreferrer" className="flex items-center gap-1 hover:text-cyan-500 transition-colors">
                                <Icon n="github" className="w-3 h-3" /> GitHub
                            </a>
                        </div>
                    </footer>
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
